<div class="container">
    <h3>Track Your Order</h3>
    <div id="statusText">Current Status: Loading...</div>
    <div class="status-bar">
        <div id="progress" class="status-progress" style="width: 0%"></div>
    </div>
</div>

<script>
    // Logic to pull order ID from URL and update bar
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('id');

    async function trackOrder() {
        const { data } = await supabaseClient
            .from('orders')
            .select('status')
            .eq('id', orderId)
            .single();
        
        const levels = { 'placed': 20, 'confirmed': 40, 'preparing': 60, 'transit': 80, 'delivered': 100 };
        document.getElementById('progress').style.width = levels[data.status] + '%';
        document.getElementById('statusText').innerText = "Status: " + data.status.toUpperCase();
    }
    setInterval(trackOrder, 5000); // Poll every 5 seconds
</script>
