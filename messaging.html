<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | TownSquare</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-weight='bold' fill='%23000'>💬</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .conversation-list {
            max-width: 300px;
            border-right: 1px solid #e5e7eb;
            overflow-y: auto;
        }
        .conversation-item {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.3s;
        }
        .conversation-item:hover {
            background: #f9fafb;
        }
        .conversation-item.active {
            background: #ecfdf5;
            border-left: 4px solid #065f46;
        }
        .message-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: #fafafa;
        }
        .message-group {
            display: flex;
            margin-bottom: 1rem;
        }
        .message-group.sent {
            justify-content: flex-end;
        }
        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            word-wrap: break-word;
        }
        .message-group.received .message-bubble {
            background: white;
            border: 1px solid #e5e7eb;
            color: #1f2937;
        }
        .message-group.sent .message-bubble {
            background: #065f46;
            color: white;
        }
        .message-input-area {
            border-top: 1px solid #e5e7eb;
            padding: 1rem;
            display: flex;
            gap: 0.75rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">💬 Messages</div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="btn btn-outline" onclick="window.history.back()">← Back</button>
        </div>
    </nav>

    <div class="container">
        <div style="display: grid; grid-template-columns: 300px 1fr; gap: 2rem; height: 700px;">
            <!-- Conversations List -->
            <div class="conversation-list" id="conversationsList"></div>

            <!-- Messages Area -->
            <div>
                <div id="selectedConversation" style="padding-bottom: 1rem; border-bottom: 2px solid #e5e7eb; margin-bottom: 1rem;">
                    <h3 style="margin: 0; color: #1f2937;">Select a conversation</h3>
                </div>

                <div class="message-container">
                    <div class="messages-area" id="messagesArea"></div>
                    <div class="message-input-area">
                        <input type="text" id="messageInput" class="input" placeholder="Type your message..." style="margin: 0; flex: 1;">
                        <button class="btn btn-primary" onclick="sendMessage()" style="padding: 0.75rem 1.5rem;">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://bsnmcvntzvywhkpjsvsi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzbm1jdm50enZ5d2hrcGpzdnNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDc5MzcsImV4cCI6MjA5MzcyMzkzN30.OsHDloa5J7UcbDwP4n8TXFhIkTnAn7INwsR-_ld-ZQ0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentConversation = null;
        let currentUser = null;

        async function initialize() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            currentUser = user;
            
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            loadConversations();
            
            // Refresh messages every 2 seconds
            setInterval(() => {
                if (currentConversation) {
                    loadMessages(currentConversation);
                }
            }, 2000);
        }

        async function loadConversations() {
            const { data: messages } = await supabaseClient
                .from('messages')
                .select('sender_id, receiver_id, order_id, profiles(full_name, email)')
                .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
                .order('created_at', { ascending: false });

            const conversations = {};
            
            if (messages) {
                messages.forEach(msg => {
                    const otherId = msg.sender_id === currentUser.id ? msg.receiver_id : msg.sender_id;
                    if (!conversations[otherId]) {
                        conversations[otherId] = msg;
                    }
                });
            }

            const list = document.getElementById('conversationsList');
            
            if (Object.keys(conversations).length === 0) {
                list.innerHTML = '<p style="padding: 1rem; color: #9ca3af;">No conversations yet</p>';
                return;
            }

            list.innerHTML = Object.entries(conversations).map(([userId, msg]) => `
                <div class="conversation-item ${currentConversation === userId ? 'active' : ''}" onclick="selectConversation('${userId}', '${msg.profiles?.full_name || msg.profiles?.email || 'User'}')">
                    <div style="font-weight: 600; color: #1f2937;">${msg.profiles?.full_name || msg.profiles?.email}</div>
                    <small style="color: #9ca3af; display: block; margin-top: 0.5rem;">Last message</small>
                </div>
            `).join('');
        }

        async function selectConversation(userId, userName) {
            currentConversation = userId;
            document.getElementById('selectedConversation').innerHTML = `
                <h3 style="margin: 0; color: #1f2937;">💬 ${userName}</h3>
            `;
            
            document.querySelectorAll('.conversation-item').forEach(el => {
                el.classList.remove('active');
            });
            event.target.closest('.conversation-item')?.classList.add('active');
            
            loadMessages(userId);
        }

        async function loadMessages(otherId) {
            const { data: messages } = await supabaseClient
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const messagesArea = document.getElementById('messagesArea');
            
            if (!messages || messages.length === 0) {
                messagesArea.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 2rem;">No messages yet. Start the conversation!</p>';
                return;
            }

            messagesArea.innerHTML = messages.map(msg => `
                <div class="message-group ${msg.sender_id === currentUser.id ? 'sent' : 'received'}">
                    <div class="message-bubble">
                        ${msg.message}
                    </div>
                </div>
            `).join('');

            // Scroll to bottom
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message || !currentConversation) return;

            const { error } = await supabaseClient
                .from('messages')
                .insert([{
                    sender_id: currentUser.id,
                    receiver_id: currentConversation,
                    message: message,
                    created_at: new Date().toISOString()
                }]);

            if (error) {
                alert('Error sending message: ' + error.message);
            } else {
                messageInput.value = '';
                loadMessages(currentConversation);
                loadConversations();
            }
        }

        // Send message on Enter key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('messageInput') === document.activeElement) {
                sendMessage();
            }
        });

        initialize();
    </script>
</body>
</html>
