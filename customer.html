<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TownSquare | Green Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <div class="logo">TownSquare</div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="btn btn-outline" onclick="showTab('marketplace')">Shop</button>
            <button class="btn btn-outline" onclick="showTab('purchases')">Orders</button>
            <div id="cart-status" onclick="showCartItems()" style="cursor: pointer; font-weight: 700; display: none;">
                🛒 <span id="cartCount"></span>
            </div>
            <button class="btn btn-danger" onclick="confirmLogout()">Logout</button>
        </div>
    </nav>

    <div id="marketplaceSection" class="container">
        <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
            <div>
                <h1 style="margin:0; font-size: 2rem; letter-spacing: -0.03em;">Fresh Picks</h1>
                <p style="color: var(--text-light); margin: 0;">Support your local community vendors</p>
            </div>
            <select id="filterCat" onchange="loadProducts()" class="input" style="width: 200px; margin:0;">
                <option value="all">All Categories</option>
                <option value="Grocery">Grocery</option>
                <option value="Electronics">Electronics</option>
                <option value="Boutique">Boutique</option>
            </select>
        </header>
        <div id="productGrid" class="grid"></div>
    </div>

    <div id="purchasesSection" class="container" style="display:none;">
        <h1 style="margin-bottom: 1.5rem;">My Orders</h1>
        <div class="purchase-tabs" id="tabGroup" style="display: flex; gap: 10px; margin-bottom: 2rem;">
            <button class="active" onclick="setActiveTab(this, 'to-pay')">To Pay</button>
            <button onclick="setActiveTab(this, 'to-ship')">To Ship</button>
            <button onclick="setActiveTab(this, 'to-receive')">To Receive</button>
            <button onclick="setActiveTab(this, 'completed')">Completed</button>
            <button onclick="setActiveTab(this, 'cancelled')">Cancelled</button>
        </div>
        <div id="orderList"></div>
    </div>

    <div id="notifyModal" class="modal-overlay" style="display:none; z-index: 10005;">
        <div class="modal-content" style="max-width: 360px; padding: 2.5rem; text-align: center;">
            <div id="notifyIcon" style="font-size: 3rem; margin-bottom: 1rem;">🔔</div>
            <h3 id="notifyTitle" style="margin: 0 0 0.5rem 0;">Notification</h3>
            <p id="notifyMessage" style="color: var(--text-light); font-size: 0.95rem;"></p>
            <button class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" onclick="closeModal('notifyModal')">OK</button>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="display:none; z-index: 10004;">
        <div class="modal-content" style="max-width: 380px; padding: 2.5rem; text-align: center;">
            <div id="confirmIcon" style="font-size: 3.5rem; margin-bottom: 1rem;">❓</div>
            <h3 id="confirmTitle" style="margin: 0 0 0.5rem 0;">Are you sure?</h3>
            <p id="confirmMessage" style="color: var(--text-light); font-size: 0.95rem;"></p>
            <div style="display: flex; gap: 12px; margin-top: 2rem;">
                <button class="btn btn-outline" style="flex: 1;" onclick="closeModal('confirmModal')">Cancel</button>
                <button id="confirmActionBtn" class="btn btn-primary" style="flex: 1;">Yes, Proceed</button>
            </div>
        </div>
    </div>

    <div id="qtyModal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 380px; padding: 2rem; text-align: center;">
            <h3 id="qtyModalTitle" style="margin-top: 0;">Select Quantity</h3>
            <p id="qtyModalPrice" style="color: var(--accent); font-weight: 800; font-size: 1.25rem; margin-bottom: 1.5rem;"></p>
            <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; background: #f1f5f9; padding: 10px; border-radius: 16px; width: fit-content; margin-inline: auto;">
                <button class="qty-btn" onclick="changePromptQty(-1)">−</button>
                <input type="number" id="promptQtyInput" class="qty-input" value="1" min="1" oninput="syncPromptQty(this.value)">
                <button class="qty-btn" onclick="changePromptQty(1)">+</button>
            </div>
            <button id="qtyConfirmBtn" class="btn btn-primary">Confirm</button>
            <button class="btn btn-outline" style="width: 100%; margin-top: 0.75rem;" onclick="closeModal('qtyModal')">Cancel</button>
        </div>
    </div>

    <div id="viewCartModal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 520px;">
            <div style="padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fafdfc;">
                <h3 style="margin:0;">Shopping Cart</h3>
                <label style="font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                    <input type="checkbox" id="selectAllCart" onchange="toggleSelectAll(this)" style="width: 18px; height: 18px; margin: 0;"> Select All
                </label>
            </div>
            <div id="cartItemsList" style="padding: 1.5rem; max-height: 400px; overflow-y: auto;"></div>
            <div style="padding: 1.5rem; border-top: 1px solid var(--border); background: white;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.25rem;">
                    <span style="color: var(--text-light); font-weight: 500;">Order Total</span>
                    <span id="cartTotalDisplay" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">$0.00</span>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-outline" style="flex: 1;" onclick="closeModal('viewCartModal')">Close</button>
                    <button class="btn btn-primary" style="flex: 2;" onclick="openCheckoutFromCart()">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <div style="padding: 1.5rem; background: var(--primary); color: white;">
                <h3 style="margin:0;">Delivery Details</h3>
            </div>
            <div style="padding: 2rem;">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-light); text-transform: uppercase;">Saved Addresses</label>
                <select id="profileDropdown" class="input" onchange="loadProfileFromDropdown(this.value)" style="margin-top: 0.5rem; background: #f8fafc;">
                    <option value="">-- Choose a Profile --</option>
                </select>
                <input type="text" id="fullname" placeholder="Recipient Name" class="input">
                <input type="text" id="phone" placeholder="Contact Number" class="input">
                <textarea id="addr" placeholder="Detailed Street Address / Landmark" class="input" style="height: 80px; resize: none;"></textarea>
                <button class="btn btn-outline" onclick="saveCurrentProfile()" style="width: auto; margin-bottom: 1.5rem; font-size: 0.8rem;">💾 Save address</button>
                <div id="map-container" style="height: 180px; border-radius: 12px; border: 1px solid var(--border); margin: 0.5rem 0 1rem 0; overflow: hidden;"></div>
                <button type="button" onclick="locateUser()" class="btn btn-outline" style="width:100%; font-size:0.85rem; margin-bottom: 2rem;">📍 Pin Current Location</button>
                <p style="font-weight: 700; font-size: 0.85rem; margin-bottom: 0.75rem;">PAYMENT METHOD</p>
                <div style="background: #f8fafc; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 2rem;">
                    <div style="display:flex; gap:1.5rem; margin-bottom: 1rem;">
                        <label style="cursor:pointer; display: flex; align-items: center; gap: 8px; font-weight: 600;">
                            <input type="radio" name="payType" value="COD" checked onchange="toggleOnlineOptions(false)" style="width: 18px; height: 18px;"> Cash on Delivery
                        </label>
                        <label style="cursor:pointer; display: flex; align-items: center; gap: 8px; font-weight: 600;">
                            <input type="radio" name="payType" value="Online" onchange="toggleOnlineOptions(true)" style="width: 18px; height: 18px;"> Online Pay
                        </label>
                    </div>
                    <div id="onlineSubOptions" style="display: none; border-top: 1px solid var(--border); margin-top: 10px; padding-top: 15px;">
                        <p style="font-size: 0.75rem; font-weight: 700; color: var(--text-light); margin-bottom: 10px; text-transform: uppercase;">Select Provider</p>
                        <div style="display: flex; gap: 1rem;">
                            <label style="flex: 1; border: 1px solid var(--border); padding: 10px; border-radius: 10px; cursor: pointer; text-align: center;">
                                <input type="radio" name="onlineProvider" value="Card" checked>
                                <div style="font-size: 1.2rem; margin-top: 4px;">💳</div>
                                <div style="font-size: 0.8rem; font-weight: 600;">Card</div>
                            </label>
                            <label style="flex: 1; border: 1px solid var(--border); padding: 10px; border-radius: 10px; cursor: pointer; text-align: center;">
                                <input type="radio" name="onlineProvider" value="E-wallet">
                                <div style="font-size: 1.2rem; margin-top: 4px;">📱</div>
                                <div style="font-size: 0.8rem; font-weight: 600;">E-wallet</div>
                            </label>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" style="padding: 1rem;" onclick="processOrder()">Place Order Now</button>
                <button class="btn btn-outline" style="width: 100%; margin-top: 0.75rem;" onclick="closeModal('checkoutModal')">Go Back</button>
            </div>
        </div>
    </div>
    <script src="customer.js"></script>
</body>
</html>
