<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TownSquare | Minimalist Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="logo">TownSquare</h1>
            
            <div id="login-section">
                <input type="email" id="login-email" placeholder="Email address">
                <input type="password" id="login-password" placeholder="Password">
                <button id="login-btn" class="btn btn-primary">Sign In</button>
                <p class="toggle-text">New here? <a href="#" id="show-signup">Create account</a></p>
            </div>

            <div id="signup-section" style="display: none;">
                <input type="text" id="signup-name" placeholder="Full name">
                <input type="email" id="signup-email" placeholder="Email address">
                <input type="password" id="signup-password" placeholder="Password">
                <select id="signup-role">
                    <option value="customer">Customer</option>
                    <option value="vendor">Vendor</option>
                </select>
                <button id="signup-btn" class="btn btn-primary">Register</button>
                <p class="toggle-text">Have an account? <a href="#" id="show-login">Sign in</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
