
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Command Center</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23065f46'><path d='M3 3h18v18H3V3zm16 16V5H5v14h14zM9 7h6v2H9V7zm0 4h6v2H9v-2zm0 4h4v2H9v-2z'/></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <h2>Admin Dashboard</h2>
        <button class="btn" onclick="handleLogout()">Logout</button>
    </nav>

    <div class="container">
        <div class="stats-bar">
            <div class="stat-card">
                <h3 id="totalVendors">0</h3>
                <p>Active Vendors</p>
            </div>
            <div class="stat-card">
                <h3 id="totalOrders">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <h3 id="totalRevenue">$0</h3>
                <p>Platform Revenue</p>
            </div>
        </div>

        <div class="card">
            <h3>Inventory Oversight</h3>
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Vendor ID</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminProductList"></tbody>
            </table>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
