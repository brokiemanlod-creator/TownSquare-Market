<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-weight='bold' fill='%23000'>🏪</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .modal-overlay { z-index:10000 !important; }
        .section-card { background:white; border:1px solid #e5e7eb; border-radius:16px; padding:2rem; margin-bottom:1.5rem; }
        .field-label { display:block; font-weight:600; margin-bottom:0.5rem; color:#374151; font-size:0.95rem; }
        .field-hint  { color:#9ca3af; font-size:0.8rem; margin-top:0.25rem; display:block; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">✏️ Edit Profile</div>
        <div style="display:flex; gap:12px; align-items:center;">
            <button class="btn btn-outline" onclick="window.location.href='vendor.html'">← Back</button>
            <button class="btn btn-danger" onclick="doLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div style="max-width:640px; margin:0 auto;">
            <header style="margin-bottom:2rem;">
                <h1 style="margin:0; font-size:2rem;">👤 Edit Your Profile</h1>
                <p style="color:#9ca3af; margin:0.5rem 0 0 0;">Update your personal and shop information</p>
            </header>

            <form id="profileForm">
                <!-- Personal Info -->
                <div class="section-card">
                    <h3 style="margin:0 0 1.5rem 0; color:#1f2937;">👤 Personal Information</h3>
                    <div style="margin-bottom:1.25rem;">
                        <label class="field-label">Full Name</label>
                        <input type="text" id="fullName" class="input" placeholder="Your full name" style="margin:0;">
                    </div>
                    <div style="margin-bottom:1.25rem;">
                        <label class="field-label">Email</label>
                        <input type="email" id="email" class="input" disabled style="background:#f3f4f6; cursor:not-allowed; margin:0;">
                        <span class="field-hint">Email cannot be changed</span>
                    </div>
                    <div>
                        <label class="field-label">Phone Number</label>
                        <input type="tel" id="phone" class="input" placeholder="+63 9XX XXX XXXX" style="margin:0;">
                    </div>
                </div>

                <!-- Shop Info -->
                <div class="section-card">
                    <h3 style="margin:0 0 1.5rem 0; color:#1f2937;">🏪 Shop Information</h3>
                    <div style="margin-bottom:1.25rem;">
                        <label class="field-label">Shop Name</label>
                        <input type="text" id="shopName" class="input" placeholder="Your shop name" style="margin:0;">
                    </div>
                    <div style="margin-bottom:1.25rem;">
                        <label class="field-label">Shop Description</label>
                        <textarea id="shopDesc" class="input" placeholder="Describe your shop and products..." style="height:100px; margin:0;"></textarea>
                    </div>
                    <div>
                        <label class="field-label">Shop Address</label>
                        <input type="text" id="shopAddress" class="input" placeholder="Your shop address" style="margin:0;">
                    </div>
                </div>

                <!-- Payment Info -->
                <div class="section-card">
                    <h3 style="margin:0 0 1.5rem 0; color:#1f2937;">💳 Payment Information</h3>
                    <p style="color:#6b7280; font-size:0.9rem; margin:0 0 1.5rem 0;">Customers will see these details when paying online.</p>
                    <div style="margin-bottom:1.25rem;">
                        <label class="field-label">📱 GCash Number</label>
                        <input type="text" id="gcashNum" class="input" placeholder="09XXXXXXXXX" style="margin:0;">
                        <span class="field-hint">Leave blank if not applicable</span>
                    </div>
                    <div>
                        <label class="field-label">💳 PayMaya Number</label>
                        <input type="text" id="paymayaNum" class="input" placeholder="09XXXXXXXXX" style="margin:0;">
                        <span class="field-hint">Leave blank if not applicable</span>
                    </div>
                </div>

                <!-- Actions -->
                <div style="display:flex; gap:10px;">
                    <button type="button" class="btn btn-outline" style="flex:1;" onclick="window.location.href='vendor.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex:1;">💾 Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- NOTIFY MODAL -->
    <div id="notifyModal" class="modal-overlay" style="display:none;">
        <div class="modal" style="max-width:420px;">
            <div style="text-align:center; padding:2rem;">
                <div id="notifyIcon" style="font-size:3.5rem; margin-bottom:1rem;"></div>
                <h2 id="notifyTitle" style="margin:0 0 0.5rem 0;"></h2>
                <p id="notifyMessage" style="color:#6b7280; margin-bottom:1.5rem;"></p>
                <button class="btn btn-primary" onclick="closeModal('notifyModal')">Got it</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bsnmcvntzvywhkpjsvsi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzbm1jdm50enZ5d2hrcGpzdnNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDc5MzcsImV4cCI6MjA5MzcyMzkzN30.OsHDloa5J7UcbDwP4n8TXFhIkTnAn7INwsR-_ld-ZQ0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function showNotify(message, type = 'info') {
            const icons = { info:'🔔', success:'✅', error:'❌', warning:'⚠️' };
            document.getElementById('notifyIcon').innerText    = icons[type] || '🔔';
            document.getElementById('notifyTitle').innerText   = type.toUpperCase();
            document.getElementById('notifyMessage').innerText = message;
            document.getElementById('notifyModal').style.display = 'flex';
        }

        async function doLogout() {
            if (confirm('Are you sure you want to logout?')) {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            }
        }

        async function loadProfile() {
            const { data: { user }, error: authErr } = await supabaseClient.auth.getUser();
            if (authErr || !user) { window.location.href = 'index.html'; return; }

            document.getElementById('email').value = user.email || '';

            const { data: profile, error: profErr } = await supabaseClient
                .from('profiles')
                .select('full_name, phone, store_name, shop_description, address, gcash_number, paymaya_number')
                .eq('id', user.id)
                .single();

            if (profErr) {
                console.warn('Profile fetch warning:', profErr.message);
            }

            if (profile) {
                document.getElementById('fullName').value   = profile.full_name || '';
                document.getElementById('phone').value      = profile.phone || '';
                document.getElementById('shopName').value   = profile.store_name || '';
                document.getElementById('shopDesc').value   = profile.shop_description || '';
                document.getElementById('shopAddress').value= profile.address || '';
                document.getElementById('gcashNum').value   = profile.gcash_number || '';
                document.getElementById('paymayaNum').value = profile.paymaya_number || '';
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async e => {
            e.preventDefault();

            const { data: { user }, error: authErr } = await supabaseClient.auth.getUser();
            if (authErr || !user) { showNotify('Not authenticated', 'error'); return; }

            const updates = {
                full_name:        document.getElementById('fullName').value.trim(),
                phone:            document.getElementById('phone').value.trim(),
                store_name:       document.getElementById('shopName').value.trim(),
                shop_description: document.getElementById('shopDesc').value.trim(),
                address:          document.getElementById('shopAddress').value.trim(),
                gcash_number:     document.getElementById('gcashNum').value.trim(),
                paymaya_number:   document.getElementById('paymayaNum').value.trim(),
                updated_at:       new Date().toISOString()
            };

            // Remove empty strings so we don't overwrite with blanks unnecessarily
            Object.keys(updates).forEach(k => { if (updates[k] === '') delete updates[k]; });

            const { error } = await supabaseClient
                .from('profiles')
                .update(updates)
                .eq('id', user.id);

            if (error) {
                console.error('Save error:', error);
                showNotify('Error saving: ' + error.message, 'error');
                return;
            }

            showNotify('Profile saved successfully!', 'success');
            setTimeout(() => { window.location.href = 'vendor.html'; }, 1800);
        });

        loadProfile();
    </script>
</body>
</html>
